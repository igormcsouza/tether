name: Release Python Package (.whl & sdist)

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Wheel & Attach to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies & run quality checks
        run: |
          uv sync
          uv run ruff check .
          uv run mypy src/
          uv run pytest

      - name: Stamp version from Git tag & build distributions (.whl + .tar.gz)
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" src/tether/__init__.py
          rm -rf dist/
          uv build
          ls -lh dist/

      - name: Create or Upload Wheel & sdist to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "${TAG_NAME}" dist/*.whl dist/*.tar.gz \
              --title "${TAG_NAME}" \
              --generate-notes
          fi
