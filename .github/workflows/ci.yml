name: CI (Lint, Typecheck, Unit & Integration Tests + 100% Coverage)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  ci:
    name: Ruff, Mypy & Pytest (100% Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy Strict Type Checking
        run: uv run mypy src/

      - name: Run Unit & Integration Tests with 100% Coverage Gate
        run: uv run pytest --cov=tether --cov-report=term-missing --cov-fail-under=100
