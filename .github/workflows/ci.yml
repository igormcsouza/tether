name: CI (Lint, Typecheck, Docs, Unit & Integration Tests + 100% Coverage)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  ci:
    name: Ruff, Mypy, MkDocs & Pytest (100% Coverage)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy Strict Type Checking
        run: uv run mypy tether/

      - name: Run Unit & Integration Tests with 100% Coverage Gate
        run: uv run pytest --cov=tether --cov-report=term-missing --cov-fail-under=100

      - name: Build Documentation (Strict Mode)
        run: uv run mkdocs build --strict
