name: Publish on PyPI

# PyPI is published ONLY from a published GitHub Release. Pre-releases are
# skipped (no PyPI upload, no assets). The tag must match __version__.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.2)"
        required: true
        type: string

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          version=$(python3 -c 'import re,pathlib; print(re.search(r"__version__ = [\x27\"]([^\x27\"]+)[\x27\"]", pathlib.Path("tether/__init__.py").read_text()).group(1))')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match package version '$version'"
            exit 1
          fi
      - name: Build package (.whl and sdist)
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC), no secrets needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach assets to the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Attach sdist and wheel to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.whl --clobber
