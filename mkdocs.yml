      - Let Claude call tether to review your writing: start/review-with-claude.md
      - Write and check a script with Nemotron: start/script-with-nemotron.md
  - Guides:
      - guides/index.md
      - Basic usage:
          - Find your way around: guides/basic/find-your-way-around.md
          - Run and manage sessions: guides/basic/run-and-manage-sessions.md
          - Built-in tools: guides/basic/built-in-tools.md
          - Configure providers and models: guides/basic/configure-providers.md
          - 'Choose a model: what to expect': guides/basic/choose-a-model.md
          - Fix a failing test with a local model: guides/basic/fix-a-failing-test.md
          - Write tasks a small model can finish: guides/basic/write-tasks-small-models.md
          - Review and debug a session: guides/basic/review-and-debug.md
          - Skills: guides/basic/skills.md
      - Advanced:
