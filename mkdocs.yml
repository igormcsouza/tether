          - Give the model a tool of your own: guides/advanced/add-your-own-tool.md
          - A pipeline where each stage has its own job: guides/advanced/pipelines.md
          - Multi-agent orchestration: guides/advanced/multi-agent.md
          - Run a session on its own branch: guides/advanced/own-branch.md
          - Security and sandbox: guides/advanced/security-and-sandbox.md
          - Gates, memory and telemetry: guides/advanced/gates-memory-telemetry.md
          - Control cost and limits: guides/advanced/control-cost-and-limits.md
          - Delegate from Claude Code, Codex or Cursor: guides/advanced/delegate-from-your-agent.md
          - Use tether inside your agent (MCP): guides/advanced/use-from-your-agent-mcp.md
          - Custom providers and transports: guides/advanced/custom-providers-and-transports.md
  - Concepts:
      - concepts/index.md
      - One action for everything: concepts/one-action-primitive.md
      - Help only when asked: concepts/progressive-help.md
      - Context and folding: concepts/context-and-folding.md
      - A prefix that never changes: concepts/kv-cache-and-static-prefix.md
      - The deterministic envelope: concepts/deterministic-envelope.md
      - Loops, stalls and fresh starts: concepts/stalls-and-restarts.md
      - The repair loop around tests: concepts/repair-loop.md
      - Thinking and sampling: concepts/thinking-and-sampling.md
  - Architecture:
