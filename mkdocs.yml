site_name: tether
site_description: General-purpose, headless-first LLM-Native micro-harness for small and frontier language models
site_author: Igor Souza
site_url: https://igormcsouza.github.io/tether/

repo_name: igormcsouza/tether
repo_url: https://github.com/igormcsouza/tether
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/igormcsouza/
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/igormcsouza
      name: GitHub
    - icon: fontawesome/solid/globe
      link: https://igormcsouza.github.io/
      name: Personal Website

copyright: Copyright &copy; 2026 Igor Souza

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Start here: index.md
  - Guides:
      - Fix a failing test with a local model: guides/fix-a-failing-test.md
      - Use tether from Claude Code, Codex or Cursor: guides/use-tether-from-your-agent.md
      - A pipeline where each stage has its own job: guides/a-pipeline-with-checks.md
      - Give the model a tool of your own: guides/add-your-own-tool.md
      - tutorial/index.md
      - CLI and Headless Sessions: tutorial/cli-and-headless.md
      - Python SDK and Custom Tools: tutorial/sdk-and-custom-tools.md
      - Built-in Tools: tutorial/built-in-tools.md
      - Progressive Skills: tutorial/skills.md
      - Async Multi-Agent Orchestration: tutorial/multi-agent.md
      - Gates, Memory, Pipelines & Telemetry: tutorial/workflows-and-telemetry.md
      - Security and Sandbox: tutorial/security-and-sandbox.md
      - Use Tether Inside Your Harness: tutorial/agent-interface.md
      - Extending Tether: extending.md
  - Concepts:
      - Architecture and Literature: architecture.md
      - Benchmark Evaluation: benchmarks.md
      - Coding Ladder: ladder/index.md
      - Coding Ladder results: ladder/results.md
      - Glossary: glossary.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
      - Harness and CLI (API): reference/harness.md
      - Context and SQLite Store: reference/context-and-store.md
      - Multiplexer and Decorator: reference/multiplexer-and-decorator.md
      - Sandbox and Skills: reference/sandbox-and-skills.md
      - Model Providers: reference/providers.md
      - Built-in Tools: reference/tools.md
      - Agent Interface (JSON, MCP): reference/agent-interface.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - Release Notes: release-notes.md

validation:
  links:
    anchors: warn
