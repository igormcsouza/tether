[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tether"
version = "0.1.0"
description = "General-purpose, headless-first LLM-Native micro-harness for small language models"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Igor Souza", email = "igormcsouza@gmail.com" }]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
tether = "tether.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
    "types-pyyaml>=6.0.12.20240311",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tether"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["tether"]
mypy_path = "src"
