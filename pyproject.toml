[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tether-sdk"
dynamic = ["version"]
description = "General-purpose, headless-first LLM-Native micro-harness for small language models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Igor Souza", email = "igormcsouza@gmail.com" }]
keywords = ["llm", "agents", "harness", "slm", "cli", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
tether = "tether.cli:main"

[project.urls]
Homepage = "https://github.com/igormcsouza/tether"
Repository = "https://github.com/igormcsouza/tether"
Documentation = "https://igormcsouza.github.io/tether/"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "types-pyyaml>=6.0.12.20240311",
]
docs = [
    "mkdocs-material>=9.5.0,<10",
    "mkdocstrings[python]>=0.26",
]

[tool.hatch.version]
path = "tether/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tether"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["tether"]
